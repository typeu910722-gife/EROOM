<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#12110e" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#F3EAD3" media="(prefers-color-scheme: light)">
<meta name="color-scheme" content="dark light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="房務">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-180.png">
<title>貳宿｜房務</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Noto+Serif+TC:wght@500;700&family=Noto+Sans+TC:wght@400;500;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#12110e; --panel:#1f1c17; --panel2:#27231c; --ink:#efe8da; --mute:#9b927f; --faint:#5f584c;
  --gold:#c9a96a; --gold2:#e4cb93; --line:rgba(201,169,106,.22); --line2:rgba(239,232,218,.08);
  --todo:#c9a96a; --prio:#e08a6d; --done:#8fb08a; --in:#8ea7c4; --none:#5f584c;
  --serif:"Cormorant Garamond","Noto Serif TC",serif; --tc:"Noto Serif TC",serif; --sans:"Noto Sans TC",system-ui,sans-serif;
  --r:12px; --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
  --hdr:rgba(18,17,14,.9); --hdr2:rgba(18,17,14,.94); --glow:#221e17; --on:#1a1612; --btn:var(--gold); --prio-bg:#2c211b; --warn-bg:#3a2019;
  --d1:#e4cb93; --d2:#a8864a; --scheme:dark;
}
/* 手機是淺色模式就換奶油風 */
@media (prefers-color-scheme: light){:root{
  --bg:#F3EAD3; --panel:#FFFDF6; --panel2:#F8EFD9; --ink:#362B20; --mute:#6E5A44; --faint:#B9A783;
  --gold:#8C5A07; --gold2:#A86A05; --line:#E8DCBF; --line2:#EFE4CC;
  --todo:#C98A12; --prio:#C8502E; --done:#3F8A5A; --in:#3D6C9E; --none:#B9A783;
  --serif:"Nunito","Noto Sans TC",sans-serif; --tc:"Noto Sans TC",sans-serif;
  --hdr:rgba(243,234,211,.92); --hdr2:rgba(255,253,246,.96); --glow:#FBF3DF; --on:#362B20; --btn:#E3A21A; --prio-bg:#FBE6DC; --warn-bg:#FBE1D6;
  --d1:#F2B93B; --d2:#C98A12; --scheme:light;
}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.65 var(--sans)}
body{background:radial-gradient(120% 60% at 50% -10%,var(--glow) 0%,var(--bg) 60%) fixed var(--bg)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-appearance:none;appearance:none}
:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding:0 18px calc(96px + var(--safe-b))}
h2{font-family:var(--tc);font-weight:500;font-size:16px;letter-spacing:.2em;color:var(--gold);margin:30px 0 12px;display:flex;align-items:center;gap:12px}
h2::after{content:"";flex:1;height:1px;background:var(--line)}
.muted{color:var(--mute)} .small{font-size:13px}

/* 頂部 */
header{position:sticky;top:0;z-index:20;background:var(--hdr);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line2);padding:calc(var(--safe-t) + 10px) 0 10px}
header .in{max-width:720px;margin:0 auto;padding:0 18px;display:flex;align-items:center;gap:12px}
.brand{font-family:var(--serif);font-size:12px;letter-spacing:.32em;color:var(--gold);white-space:nowrap}
.props{display:flex;gap:4px;margin:0 auto}
.props button{border:0;background:none;color:var(--mute);font-family:var(--tc);font-weight:700;font-size:17px;letter-spacing:.12em;padding:4px 7px;white-space:nowrap;border-bottom:1px solid transparent}
.props button[aria-pressed=true]{color:var(--ink);border-bottom-color:var(--gold)}
.lock{border:1px solid var(--line);background:none;color:var(--mute);width:34px;height:34px;border-radius:50%;font-size:14px;line-height:1;display:grid;place-items:center}
.lock.on{color:var(--gold2);border-color:var(--gold)}

/* 底部分頁 */
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:20;background:var(--hdr2);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line2);display:flex;justify-content:center;padding-bottom:var(--safe-b)}
nav.tabs button{position:relative;flex:1;max-width:150px;border:0;background:none;padding:10px 0 12px;color:var(--faint);font-size:12px;letter-spacing:.12em;display:flex;flex-direction:column;align-items:center;gap:3px}
nav.tabs svg{width:21px;height:21px}
nav.tabs button[aria-current=page]{color:var(--gold2)}

section.page{display:none}
section.page.on{display:block}

/* 日期列 */
.dayrow{display:flex;align-items:center;justify-content:center;gap:14px;margin:20px 0 14px}
.dayrow .arr{border:0;background:none;color:var(--gold);font-size:22px;width:36px;height:36px}
.datepill{display:flex;align-items:center;gap:12px;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 18px}
.datepill svg{width:15px;height:15px;color:var(--gold)}
.dayrow .date{font-family:var(--serif);font-size:20px;letter-spacing:.12em}
.dayrow .wk{font-family:var(--tc);font-size:17px;letter-spacing:.12em}
.today{-webkit-appearance:none;appearance:none;border:1px solid var(--line);background:none;color:var(--gold);border-radius:999px;font-size:12.5px;padding:3px 14px;letter-spacing:.12em}

.notice{display:flex;align-items:center;gap:14px;max-width:420px;margin:0 auto 18px;border:1px solid var(--line);background:linear-gradient(180deg,var(--panel2),var(--panel));border-radius:var(--r);padding:12px 16px;position:relative}
.notice .ic{flex:none;width:30px;height:30px;border-radius:50%;border:1px solid var(--gold);color:var(--gold);display:grid;place-items:center;font-family:var(--serif);font-size:16px}
.notice b{display:block;font-size:12.5px;letter-spacing:.2em;color:var(--gold);font-weight:500}
.notice span{font-family:var(--tc);letter-spacing:.12em}

/* 今日要掃 */
.hero{text-align:center;margin:8px 0 6px}
.hero .n{font-family:var(--serif);font-weight:600;font-size:76px;line-height:.95;color:var(--gold2)}
.hero .u{font-family:var(--tc);letter-spacing:.35em;font-size:15px;margin-top:2px}
.hero .sub{display:flex;justify-content:center;gap:16px;flex-wrap:wrap;margin-top:10px;font-size:13px;color:var(--mute);letter-spacing:.08em}
.hero .sub b{font-family:var(--serif);font-size:18px;color:var(--ink);font-weight:600;margin-right:2px}
.hero .sub .p b{color:var(--prio)}
.hero .sub a{color:var(--prio);text-decoration:none}
.hero .zero{font-family:var(--tc);letter-spacing:.2em;color:var(--mute);padding:20px 0}

.fgroup{display:flex;gap:14px;padding:12px 0;border-top:1px solid var(--line2)}
.fgroup:first-child{border-top:1px solid var(--line)}
.fgroup .fl{width:34px;flex:none;font-family:var(--serif);font-size:24px;color:var(--gold);line-height:1.6}
.fgroup ul{list-style:none;margin:0;padding:0;flex:1}
.trow{width:100%;display:flex;align-items:baseline;gap:12px;border:0;background:none;text-align:left;padding:3px 0;border-bottom:1px dashed var(--line2)}
.fgroup li:last-child .trow{border-bottom:0}
.trow .no{font-family:var(--serif);font-weight:600;font-size:30px;line-height:1.1;color:var(--ink);width:62px;flex:none}
.trow .kd{font-family:var(--tc);font-size:16px;letter-spacing:.1em;color:var(--gold2)}
.trow .pri{font-size:11.5px;letter-spacing:.15em;color:var(--on);background:var(--prio);border-radius:999px;padding:1px 8px;align-self:center}
.trow .ex{font-size:13px;color:var(--mute);margin-left:auto;text-align:right}
.trow.k-退入 .kd{color:var(--prio)}
.trow.k-續住 .kd{color:var(--ink)}

/* 標記工具（收合）*/
details.tools{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);margin:0 0 14px}
details.tools summary{list-style:none;padding:11px 16px;font-family:var(--tc);letter-spacing:.15em;color:var(--gold);display:flex;align-items:center;gap:8px;cursor:pointer}
details.tools summary::-webkit-details-marker{display:none}
details.tools summary::after{content:"＋";margin-left:auto;color:var(--mute)}
details.tools[open] summary::after{content:"－"}
details.tools .hint{font-size:13px;color:var(--mute);padding:0 16px 8px}
details.tools .row{display:flex;gap:6px;flex-wrap:wrap;padding:0 16px 14px}
.tool{border:1px solid var(--line);background:none;border-radius:999px;padding:6px 13px;font-size:14px;letter-spacing:.06em;white-space:nowrap}
.tool i{font-style:normal;display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;vertical-align:1px}
.tool[aria-pressed=true]{background:var(--btn);color:var(--on);border-color:var(--gold)}
.tool.text{border-style:dashed}

/* 總房間表 */
.floor{display:flex;gap:14px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line2)}
.floor .fl{width:34px;flex:none;font-family:var(--serif);font-size:24px;color:var(--gold);line-height:1.6}
.grid{flex:1;display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.plate{position:relative;border:1px solid var(--line2);border-radius:10px;background:var(--panel);padding:6px 4px 7px;text-align:center;min-height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--faint)}
.plate .no{font-family:var(--serif);font-weight:600;font-size:24px;line-height:1.05}
.plate .kd{font-size:11px;letter-spacing:.06em;line-height:1.3}
.plate .st,.plate .tag{display:none}
.plate.k-退房,.plate.k-續住.s-todo{border-color:var(--gold);color:var(--gold2);background:linear-gradient(180deg,var(--panel2),var(--panel))}
.plate.k-退房 .kd,.plate.k-續住.s-todo .kd{color:var(--gold)}
.plate.k-退入{border-color:var(--prio);color:var(--ink);background:linear-gradient(180deg,var(--prio-bg),var(--panel))}
.plate.k-退入 .kd{color:var(--prio)}
.plate.k-入住{border-color:rgba(142,167,196,.5);color:var(--ink)}
.plate.k-入住 .kd{color:var(--in)}
.plate.k-續住{color:var(--mute)}
.plate .mini{position:absolute;top:3px;right:6px;font-size:10px;color:var(--mute)}
.plate .warn{position:absolute;top:2px;left:5px;font-size:11px}
.plate.flash{animation:flash .5s}
@keyframes flash{from{transform:scale(.92)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.plate.flash{animation:none}}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--mute);margin:10px 0 0}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}

.list{background:var(--panel);border-radius:var(--r);border:1px solid var(--line2);overflow:hidden}
.empty{padding:18px 16px;color:var(--mute);letter-spacing:.05em}

/* 抽屜 */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40;display:none}
.scrim.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--panel);border-top:1px solid var(--line);border-radius:20px 20px 0 0;max-height:88vh;overflow:auto;transform:translateY(105%);transition:transform .24s ease;padding:8px 20px calc(24px + var(--safe-b));max-width:720px;margin:0 auto}
.sheet.on{transform:none}
@media (prefers-reduced-motion:reduce){.sheet{transition:none}}
.sheet .grab{width:40px;height:3px;border-radius:2px;background:var(--line);margin:6px auto 12px}
.sheet h3{margin:0;font-family:var(--serif);font-weight:600;font-size:46px;line-height:1;color:var(--gold2)}
.sheet h3.t{font-family:var(--tc);font-size:22px;letter-spacing:.15em;color:var(--ink)}
.sheet .sub{color:var(--mute);font-size:13px;margin:4px 0 12px;letter-spacing:.05em}
.lbl{font-size:12.5px;color:var(--gold);letter-spacing:.18em;margin:16px 0 7px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{white-space:nowrap;flex:none;border:1px solid var(--line);background:none;border-radius:999px;padding:6px 15px;letter-spacing:.06em}
.chip[aria-pressed=true]{background:var(--btn);border-color:var(--btn);color:var(--on)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
input[type=time],input[type=date],input[type=text],input[type=password],textarea,select{width:100%;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:9px 11px;color-scheme:var(--scheme)}
textarea{min-height:90px;resize:vertical;line-height:1.65}
.steps{margin:0;padding-left:22px;color:var(--ink)}.steps li{padding:3px 0}
.steps li::marker{color:var(--gold);font-family:var(--serif)}
.btnrow{display:flex;gap:8px;margin-top:20px}
.btn{border:1px solid var(--btn);border-radius:999px;padding:10px 20px;letter-spacing:.12em;background:var(--btn);color:var(--on);font-weight:500}
.btn.ghost{background:none;color:var(--ink);border-color:var(--line)}
.btn.wide{flex:1}
.addbtn{width:100%;margin:18px 0 6px;padding:13px;border-radius:var(--r);border:1px dashed var(--gold);background:none;color:var(--gold);letter-spacing:.12em}
.pick{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:7px 14px}
.pick input{display:none}
.thumbs{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.thumbs img{width:64px;height:64px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.qty{display:flex;align-items:center;gap:6px}.qty button{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:none}
.qty b{min-width:22px;text-align:center;font-family:var(--serif);font-size:20px}
.sitem{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px dashed var(--line2)}.sitem:first-child{border-top:0}
.sitem label{flex:1;display:flex;gap:9px;align-items:center}.sitem input{width:18px;height:18px;accent-color:var(--gold)}

/* 內容頁 */
.subtabs{display:flex;gap:6px;overflow-x:auto;margin:20px 0 6px;scrollbar-width:none}
.subtabs::-webkit-scrollbar{display:none}
.meta{display:flex;align-items:center;gap:8px;margin:12px 0;font-size:12.5px;color:var(--mute);letter-spacing:.05em;min-height:34px}
.meta .btn{margin-left:auto;padding:6px 16px;font-size:13px}
.draft{border:1px solid var(--line);color:var(--gold);border-radius:999px;padding:1px 10px;font-size:12px;letter-spacing:.1em}
.doc{background:var(--panel);border:1px solid var(--line2);border-radius:var(--r);padding:6px 20px 18px}
.doc h3{font-family:var(--tc);font-weight:700;font-size:17px;letter-spacing:.12em;color:var(--gold2);margin:20px 0 6px}
.doc h4{font-size:15px;margin:14px 0 4px}
.doc ul,.doc ol{padding-left:22px;margin:6px 0}
.doc li{margin:4px 0}
.doc li::marker{color:var(--gold)}
.doc p{margin:8px 0}


.rcard{display:flex;gap:14px;align-items:flex-start;padding:12px 16px;border:0;border-top:1px solid var(--line2);background:none;width:100%;text-align:left}
.rcard:first-child{border-top:0}
.rcard .no{font-family:var(--serif);font-weight:600;font-size:26px;width:52px;flex:none;line-height:1.1;color:var(--gold2)}
.rcard .tp{font-family:var(--tc);letter-spacing:.08em}
.rcard .nt{color:var(--mute);font-size:13px}


.rpt-nav{display:flex;align-items:center;justify-content:center;gap:14px;margin:6px 0 16px}
.rpt-nav .mo{font-family:var(--serif);font-size:30px;letter-spacing:.1em;color:var(--gold2)}
.rpt-nav button{border:0;background:none;color:var(--gold);font-size:22px;width:36px;height:36px}
.rpt-nav button:disabled{color:var(--faint)}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px;margin-bottom:14px}
.stat{background:var(--panel);border:1px solid var(--line2);border-radius:var(--r);padding:10px 12px}
.stat b{display:block;font-family:var(--serif);font-weight:600;font-size:32px;line-height:1.05;color:var(--gold2)}
.stat span{font-size:12px;color:var(--mute);letter-spacing:.06em}
.bars{display:flex;align-items:flex-end;gap:2px;height:120px;background:var(--panel);border:1px solid var(--line2);border-radius:var(--r);padding:10px 10px 22px}
.bars .b{flex:1;position:relative;height:100%;display:flex;flex-direction:column;justify-content:flex-end}
.bars.wide{gap:8px;padding-top:22px}.bars .b .v{position:absolute;top:-17px;left:0;right:0;text-align:center;font-family:var(--serif);font-size:13px;color:var(--gold2)}
.bars.duo2 .b .pair{display:flex;align-items:flex-end;gap:1px;height:100%}.bars.duo2 .b .pair i{flex:1}.bars.duo2 .b .pair i.f{background:var(--prio)}
.bars .b i{display:block;background:linear-gradient(180deg,var(--gold2),var(--gold));border-radius:2px 2px 0 0;opacity:.85}
.bars .b em{position:absolute;bottom:-19px;left:50%;transform:translateX(-50%);font-size:11px;font-style:normal;color:var(--mute);font-family:var(--serif)}
.tablewrap{overflow-x:auto}
.rbar{display:flex;align-items:center;gap:12px;padding:7px 16px;border-top:1px solid var(--line2)}.rbar:first-child{border-top:0}
.rbar .no{font-family:var(--serif);font-weight:600;font-size:22px;width:52px;color:var(--gold2)}
.rbar .track{flex:1;height:8px;border-radius:4px;background:var(--panel2)}.rbar .track i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--gold),var(--gold2))}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:4px 0 14px}.duo .hero .n small{font-size:.45em;margin-left:2px}.duo .hero .n{font-size:64px}
.bars.pctb .b i{background:linear-gradient(180deg,var(--d1),var(--d2))}
.rbar .pc{width:52px}.rbar .ct{font-size:12px;color:var(--mute);width:66px;text-align:right}
.pie{display:flex;align-items:center;justify-content:center;gap:22px;margin:8px 0 6px;flex-wrap:wrap}
.donut .pv{font-family:var(--serif);font-weight:600;font-size:52px;fill:var(--gold2)}.donut .pp{font-size:24px}
.donut .pl{font-family:var(--tc);font-size:14px;letter-spacing:.3em;fill:var(--ink)}
.donut .pvs{font-family:var(--serif);font-weight:600;font-size:17px;fill:var(--gold2)}
.pside{display:flex;flex-direction:column;gap:10px}.pside div{display:flex;flex-direction:column}
.pside b{font-family:var(--serif);font-weight:600;font-size:28px;line-height:1.05;color:var(--gold2)}.pside b.dim{color:var(--mute)}
.pside span{font-size:12px;color:var(--mute);letter-spacing:.06em}
.pies{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px}
.pi{background:var(--panel);border:1px solid var(--line2);border-radius:var(--r);padding:10px 4px 8px;display:flex;flex-direction:column;align-items:center}
.pi b{font-family:var(--serif);font-weight:600;font-size:20px;color:var(--ink);margin-top:2px}.pi span{font-size:11.5px;color:var(--mute)}
.rbar b{font-family:var(--serif);font-size:20px;font-weight:600;width:30px;text-align:right}
.rtable{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line2);border-radius:var(--r);font-size:14px}
.rtable th,.rtable td{padding:7px 9px;text-align:right;border-top:1px solid var(--line2);white-space:nowrap}
.rtable th{font-size:12px;color:var(--gold);font-weight:400;letter-spacing:.08em;border-top:0}
.rtable td:first-child{text-align:left;font-family:var(--serif);font-size:19px;font-weight:600;color:var(--gold2)}
.rtable th:first-child{text-align:left}
.rtable tr.sum td{color:var(--gold2);border-top:1px solid var(--line)}
.rtable tr.sum td:first-child{font-family:var(--tc);font-size:14px}

.logi{background:var(--panel);border:1px solid var(--line2);border-radius:var(--r);padding:11px 14px;margin-bottom:8px;display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left}
.logi .no{font-family:var(--serif);font-weight:600;font-size:26px;line-height:1.05;color:var(--gold2);width:56px;flex:none}
.logi .bd{flex:1;min-width:0}.logi .tp{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}

.bfr .bd{flex:1;min-width:0;font-size:14px}
.bfr .it{display:flex;gap:6px;flex-wrap:wrap;align-items:baseline}.bfr .it i{font-style:normal;color:var(--mute)}

<script>
'use strict';
const PROPS = { ersu: '貳宿', eryanglou: '貳洋樓', erlu: '貳侶' };
// kind（存檔值）→ 顯示
const KINDS = {
  '退房': { label: '退房', color: 'var(--todo)', status: 'todo' },
  '退入': { label: '退房→入住', color: 'var(--prio)', status: 'todo' },
  '續住': { label: '續住', color: 'var(--todo)', status: 'todo' },
  '入住': { label: '入住', color: 'var(--in)', status: '' },
};
const STATUS = { todo: '要掃', done: '要掃', '': '不用掃' };
const TOOLS = [
  { id: '退房', kind: '退房', label: '退房', color: 'var(--todo)' },
  { id: '退入', kind: '退入', label: '退房→入住', color: 'var(--prio)' },
  { id: '續住', kind: '續住', label: '續住', color: 'var(--todo)' },
  { id: '入住', kind: '入住', label: '入住', color: 'var(--in)' },
  { id: 'clear', clear: true, label: '清空', color: 'var(--none)' },
];
const WK = ['日', '一', '二', '三', '四', '五', '六'];

// ---------- 預設內容（管理員未編輯前顯示為草稿）----------
const DEFAULTS = {
  handbook: { title: '員工守則', text:
`### 上班
- 到班先看「今日要掃」，退房→入住（紅色）的房間優先
- 開始掃之前，先在網站上確認每間房的狀況；掃完在 LINE 群組回報房況
- 手機保持有電，有狀況先在房號備註寫下，再 LINE 通知管理者

### 進出房間
- 一律先敲門三下並出聲「房務」，等 10 秒再開門
- 續住房若掛「請勿打擾」不進房，在備註寫「勿擾」
- 客人在房內時不打掃，約時間再來

### 客人物品
- 不翻動、不丟棄客人的私人物品
- 遺留物拍照、裝袋、寫房號與日期，交給管理者

### 安全與清潔
- 化學清潔劑不混用，打掃浴室時開抽風
- 碰到針頭、碎玻璃等危險物，戴手套處理並回報
- 備品不足或設備故障，在房號備註寫下並通知管理者` },
  stay: { title: '續住整理', text:
`### 每日必做
1. 敲門確認無人、未掛勿擾
2. 垃圾桶清空、換新垃圾袋
3. 整理床鋪（床單不換，拉平、枕頭擺正）
4. 浴室：擦乾洗手台與地面、補衛生紙
5. 用過的毛巾收走，補上乾淨毛巾
6. 補飲用水與茶包
7. 客人物品保持原位，不收納、不移動

### 第三晚起
- 更換床單、枕套、被套（客人要求不換則跳過）

### 不做的事
- 不整理客人行李與衣物
- 不丟客人放在桌上的任何東西，即使看起來像垃圾` },
  checkout: { title: '退房整理', text:
`### 流程
1. 開窗通風、打開所有燈檢查
2. 檢查遺留物（抽屜、床下、浴室、插座）
3. 撤下全部床品與毛巾
4. 清垃圾、換垃圾袋
5. 浴室刷洗：馬桶、洗手台、淋浴間、鏡子
6. 擦拭桌面、開關、遙控器、門把
7. 鋪床、擺放毛巾
8. 依備品清單補齊
9. 吸地、拖地
10. 關窗、關燈、冷氣關閉，在 LINE 回報這間掃好了

### 退房→入住（優先）
- 下一組客人當天入住，先掃這幾間，入住時間前要完成` },
  checklist: { stay: ['垃圾清空', '床鋪整理', '浴室擦乾', '換毛巾', '補衛生紙', '補水與茶包'],
    checkout: ['檢查遺留物', '撤床品毛巾', '垃圾清空', '浴室刷洗', '擦拭桌面門把', '鋪床', '補備品', '吸地拖地', '關燈關冷氣'] },
  roominfo: { rooms: {} },
};

// ---------- 狀態 ----------
const ls = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
const ss = {
  get(k) { try { return sessionStorage.getItem(k) || ''; } catch { return ''; } },
  set(k, v) { try { v ? sessionStorage.setItem(k, v) : sessionStorage.removeItem(k); } catch {} },
};
const S = {
  prop: ls.get('eroom.prop', 'ersu'),
  date: todayStr(),
  rooms: {},     // prop -> [rooms]
  recs: {},      // `${prop}|${date}` -> {room: data}
  docs: {},
  tool: null,
  tab: 'today',
  bookKey: 'handbook',
  admin: ss.get('eroom.admin'),
  pending: ls.get('eroom.pending', []),
  logs: {}, logCat: '', roomView: 'report', month: todayStr().slice(0, 7), rptType: 'm', rptYear: +todayStr().slice(0, 4), rptHalf: +todayStr().slice(5, 7) <= 6 ? 1 : 2, reports: {}, me: ls.get('eroom.me', ''),
};

function todayStr(d = new Date()) {
  const t = new Date(d.getTime() + 8 * 3600e3); // 台灣時間
  return t.toISOString().slice(0, 10);
}
function addDays(s, n) { const d = new Date(s + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); }
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const key = () => S.prop + '|' + S.date;
const recs = () => (S.recs[key()] ||= {});
// 網址可直接指定：?p=ersu&d=2026-10-15

// ---------- API ----------
async function api(path, opts = {}) {
  const headers = { 'content-type': 'application/json' };
  if (S.admin) headers['x-admin'] = S.admin;
  const r = await fetch('/api/' + path, { ...opts, headers });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw Object.assign(new Error(j.error || ('HTTP ' + r.status)), { status: r.status });
  return j;
}
async function loadRooms(p) {
  const j = await api('config?p=' + p);
  S.rooms[p] = j.config.rooms || [];
}
async function loadRecs(p = S.prop, d = S.date) {
  const j = await api('records?p=' + p + '&d=' + d);
  S.recs[p + '|' + d] = j.records || {};
}

// 寫入：先改畫面，再排隊送出（離線也不會掉）
let flushTimer = null;
function queue(p, d, items) {
  for (const it of items) {
    const i = S.pending.findIndex((x) => x.p === p && x.d === d && x.room === it.room);
    // 換成新物件（不要原地修改），送出中的那批才不會把這次的改動一起標成「已送出」
    if (i >= 0) S.pending[i] = { ...S.pending[i], data: { ...S.pending[i].data, ...it.data } };
    else S.pending.push({ p, d, room: it.room, data: it.data });
  }
  ls.set('eroom.pending', S.pending);
  clearTimeout(flushTimer);
  flushTimer = setTimeout(flush, 350);
}
let flushing = false;
async function flush() {
  if (flushing || !S.pending.length) return;
  flushing = true;
  const batch = S.pending.slice();
  const groups = {};
  for (const x of batch) (groups[x.p + '|' + x.d] ||= []).push({ room: x.room, data: x.data });
  try {
    for (const g in groups) {
      const [p, d] = g.split('|');
      await api('records', { method: 'POST', body: JSON.stringify({ p, d, items: groups[g] }) });
    }
    S.pending = S.pending.filter((x) => !batch.includes(x));
    ls.set('eroom.pending', S.pending);
    $('#offline').classList.remove('on');
  } catch (e) {
    $('#offline').classList.add('on');
    setTimeout(flush, 8000);
  } finally { flushing = false; }
}
addEventListener('online', flush);

// ---------- 套用標記 ----------
let undoStack = null;
function apply(rooms, change, label) {
  const R = recs();
  const before = {};
  const items = [];
  for (const room of rooms) {
    const cur = R[room] || {};
    before[room] = { kind: cur.kind || '', status: cur.status || '', note: cur.note || '' };
    let next;
    if (change.full) next = { ...change.full };
    else if (change.clear) next = { kind: '', status: '', note: '' };
    else if (change.kind) next = { kind: change.kind, status: KINDS[change.kind].status };
    else next = { ...change };
    R[room] = { ...cur, ...next };
    items.push({ room, data: next });
  }
  undoStack = { p: S.prop, d: S.date, before };
  queue(S.prop, S.date, items);
  renderToday(rooms);
  toast((label || '已更新') + '：' + rooms.join('、'), true);
}
function undo() {
  if (!undoStack) return;
  const { p, d, before } = undoStack;
  const R = S.recs[p + '|' + d] || {};
  const items = [];
  for (const room in before) { R[room] = { ...R[room], ...before[room] }; items.push({ room, data: before[room] }); }
  queue(p, d, items);
  undoStack = null;
  renderToday();
  toast('已復原');
}

function kindText(d) {

  if (d.kind === '續住') return d.status === 'todo' ? '續住要掃' : (d.status === 'done' ? '續住' : '續住不用掃');

    }).join('')}</ul></div>`).join('');

function plate(r, x, flash) {

  return `<button class="${cls}" data-room="${esc(r)}" aria-label="${esc(r)} ${esc(kindText(x) || '空房')}">
    ${x.kind ? '<span class="tag"></span>' : ''}<span class="no">${esc(r)}</span>

}

// ---------- 貼上文字快速輸入 ----------
const WORDS = [
  [/退房?\s*(→|->|接|轉)\s*入住?|退入|退房入住/, { kind: '退入' }],
  [/續住?/, { kind: '續住' }],
  [/退房?/, { kind: '退房' }],
  [/入住?/, { kind: '入住' }],
  [/不用掃|免掃/, { status: '' }],
  [/清空|清除|取消/, { clear: true }],
];
function parseText(text, rooms) {
  const out = []; let cur = null;
  const set = new Set(rooms.map((r) => r.toUpperCase()));
  const tokens = text.replace(/[，,、；;：:\n\/]+/g, ' ').split(/\s+/).filter(Boolean);
  for (let tk of tokens) {
    // 「退房201」這種黏在一起的也拆開
    const m = tk.match(/^([^\dA-Za-z]+)?([\dA-Za-z]+)?$/);
    const word = m ? m[1] : tk, num = m ? m[2] : null;
    if (word) { const w = WORDS.find(([re]) => re.test(word)); if (w) cur = w[1]; }
    if (num && set.has(num.toUpperCase()) && cur) out.push({ room: rooms.find((r) => r.toUpperCase() === num.toUpperCase()), change: cur });
  }
  return out;
}

      R[room] = { ...cur, ...next };

// ---------- 簡易 markdown ----------
function md(src) {
  const lines = String(src || '').split('\n'); let h = ''; let list = null;
  const inline = (s) => esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
  const close = () => { if (list) { h += `</${list}>`; list = null; } };
  for (const ln of lines) {
    let m;
    if ((m = ln.match(/^###\s+(.*)/))) { close(); h += `<h3>${inline(m[1])}</h3>`; }
    else if ((m = ln.match(/^####\s+(.*)/))) { close(); h += `<h4>${inline(m[1])}</h4>`; }
    else if ((m = ln.match(/^\s*[-*]\s+(.*)/))) { if (list !== 'ul') { close(); h += '<ul>'; list = 'ul'; } h += `<li>${inline(m[1])}</li>`; }
    else if ((m = ln.match(/^\s*\d+[.、]\s*(.*)/))) { if (list !== 'ol') { close(); h += '<ol>'; list = 'ol'; } h += `<li>${inline(m[1])}</li>`; }
    else if (ln.trim()) { close(); h += `<p>${inline(ln)}</p>`; }
    else close();
  }
  close(); return h;
}

async function saveDoc(k, data) {

    const portions = [];
    const n = Math.max(C.meal.length, C.drink.length);
    for (let i = 0; i < n; i++) {
      const meal = cell(r, C.meal[i]), drink = cell(r, C.drink[i]);

// ---- 評論 ----
function parseRev(rows) {
  const head = rows[0] || [];
  const C = cols(head, [['date', /日期/], ['src', /來源/], ['lvl', /優劣|好評|負評/], ['tags', /內容/, true], ['desc', /說明/], ['score', /分數/], ['note', /備註/]]);
  return rows.slice(1).map((r) => {
    const src = cell(r, C.src), sc = cell(r, C.score), lv = cell(r, C.lvl);
    const m = sc.match(/([\d.]+)\s*分?(?:.*?滿分\s*(\d+))?/);
    const v = m ? +m[1] : null, max = m && m[2] ? +m[2] : /google/i.test(src) ? 5 : 10;
    const lvl = /負/.test(lv) ? '負評' : /普通/.test(lv) ? '普通' : /好/.test(lv) ? '好評' : lv;
    return { date: normDate(cell(r, C.date)), src, lvl, tags: C.tags.map((i) => cell(r, i)).filter(Boolean), desc: cell(r, C.desc), v, max, pct: v != null ? v / max * 100 : null, note: cell(r, C.note) };
  }).filter((x) => x.date);
}
S.rev = { per: '30', src: '', lvl: '', tag: '' };
const avg = (a) => (a.length ? a.reduce((s, x) => s + x, 0) / a.length : null);
async function renderRev() {
  let J;
  sheetMeta('#revMeta', curSheetId(), '評論');
  if (!S.sheet[S.prop + '|' + curSheetId() + '|評論']) $('#revBody').innerHTML = '<p class="empty">讀取中⋯</p>';
  try { J = await loadSheet('評論'); } catch (e) { $('#revBody').innerHTML = `<p class="empty">${esc(e.message)}</p>`; return; }
  if (S.tab !== 'rev') return;
  sheetMeta('#revMeta', J.id, '評論');
  const all = parseRev(J.rows || []).sort((a, b) => b.date.localeCompare(a.date));
  const F = S.rev, t = todayStr();
  const inPer = (x) => F.per === 'all' ? true : F.per === '30' ? x.date >= addDays(t, -30) : F.per === 'm' ? x.date.slice(0, 7) === t.slice(0, 7) : x.date.slice(0, 7) === addDays(t.slice(0, 7) + '-01', -1).slice(0, 7);
  const P = all.filter(inPer);
  const srcs = [...new Set(all.map((x) => x.src).filter(Boolean))];
  const tags = {}; for (const x of P) for (const g of x.tags) tags[g] = (tags[g] || 0) + 1;
  const list = P.filter((x) => (!F.src || x.src === F.src) && (!F.lvl || x.lvl === F.lvl) && (!F.tag || x.tags.includes(F.tag)));
  const chip = (k, v, label) => `<button class="chip" data-rv="${k}" data-v="${esc(v)}" aria-pressed="${F[k] === v}">${esc(label)}</button>`;
  const cnt = (l) => P.filter((x) => x.lvl === l).length;
  const tagE = Object.entries(tags).sort((a, b) => b[1] - a[1]); const tmax = Math.max(1, ...tagE.map((x) => x[1]));
  $('#revBody').innerHTML = `
    <div class="chips" style="margin-bottom:12px">${[['30', '近 30 天'], ['m', '本月'], ['pm', '上個月'], ['all', '全部']].map(([v, l]) => chip('per', v, l)).join('')}</div>
    <div class="stats">
      <div class="stat"><b>${P.length}</b><span>則評論</span></div>
      ${srcs.map((s) => { const a = avg(P.filter((x) => x.src === s && x.v != null).map((x) => x.v)); const mx = (P.find((x) => x.src === s) || {}).max || (/google/i.test(s) ? 5 : 10); return `<div class="stat"><b>${a == null ? '—' : a.toFixed(1)}</b><span>${esc(s)} 平均（滿分 ${mx}）</span></div>`; }).join('')}
      <div class="stat"><b style="${cnt('負評') ? 'color:var(--prio)' : ''}">${cnt('負評')}</b><span>負評</span></div>
    </div>
    <div class="legend" style="margin-top:-4px"><span>好評 ${cnt('好評')}</span><span>普通 ${cnt('普通')}</span><span style="color:var(--prio)">負評 ${cnt('負評')}</span></div>
    ${tagE.length ? `<h2>被提到的問題</h2><div class="list">${tagE.map(([g, n]) => `<button class="rbar" data-rv="tag" data-v="${esc(F.tag === g ? '' : g)}" style="width:100%;background:none;border-left:0;border-right:0;border-bottom:0;${F.tag === g ? 'color:var(--gold2)' : ''}"><span style="width:96px;text-align:left;font-size:14px">${esc(g)}</span><span class="track"><i style="width:${n / tmax * 100}%"></i></span><b>${n}</b></button>`).join('')}</div>` : ''}
    <h2>評論</h2>
    <div class="chips" style="margin-bottom:6px">${chip('src', '', '全部來源')}${srcs.map((s) => chip('src', s, s)).join('')}</div>
    <div class="chips" style="margin-bottom:12px">${chip('lvl', '', '全部')}${['好評', '普通', '負評'].map((l) => chip('lvl', l, l)).join('')}${F.tag ? chip('tag', '', '✕ ' + F.tag) : ''}</div>
    ${list.length ? list.map((x) => `<div class="rvi${x.lvl === '負評' ? ' neg' : ''}"><div class="tp">
        <span class="bdg ${x.lvl === '負評' ? 'red' : x.lvl === '普通' ? 'dim' : ''}">${esc(x.lvl)}</span><span class="bdg dim">${esc(x.src)}</span>
        ${x.v != null ? `<span class="sc">${x.v}<small>/${x.max}</small></span>` : ''}${x.tags.map((g) => `<span class="bdg">${esc(g)}</span>`).join('')}<span class="dt">${mdShort(x.date)}</span></div>
        <p class="tx${/^（.*）$/.test(x.desc) ? ' dim' : ''}">${esc(x.desc || '（無文字評論）')}</p>${x.note ? `<div class="nt">${esc(x.note)}</div>` : ''}</div>`).join('') : '<p class="empty">這段期間沒有符合的評論。</p>'}
    <p class="muted small">資料來自試算表「評論」分頁，約 2 分鐘更新一次。</p>`;
}

  if (S.admin) { S.admin = ''; ss.set('eroom.admin', ''); renderLock(); renderAll(); toast('已登出管理員'); return; }
  $('#sheetBody').innerHTML = `<h3 class="t">管理員登入</h3><div class="sub">登入後可以編輯手冊、備品、房號與房間資料。員工不用登入。</div>
    <input type="password" id="aPw" autocomplete="current-password" placeholder="管理員密碼">
    <div class="btnrow"><button class="btn ghost" id="aClose">取消</button><button class="btn wide" id="aGo">登入</button></div>`;
  $('#aClose').onclick = closeSheet;
  const go = async () => {
    const pw = $('#aPw').value; if (!pw) return;
    S.admin = pw;
    try { await api('admin', { method: 'POST' }); ss.set('eroom.admin', pw); closeSheet(); renderLock(); renderAll(); toast('管理員已登入'); }
    catch (e) { S.admin = ''; toast(e.message, false, true); }
  };
  $('#aGo').onclick = go; $('#aPw').onkeydown = (e) => { if (e.key === 'Enter') go(); };
  openSheet(); setTimeout(() => $('#aPw').focus(), 250);
};

// ---------- toast ----------
let toastT;
function toast(msg, canUndo, err) {
  const t = $('#toast');
  $('#toastMsg').textContent = msg;
  $('#toastUndo').style.display = canUndo ? '' : 'none';
  t.classList.toggle('err', !!err);
  t.classList.add('on');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), canUndo ? 5000 : 2400);
}
$('#toastUndo').onclick = () => { $('#toast').classList.remove('on'); undo(); };

// ---------- 事件 ----------
document.addEventListener('click', (e) => {
  const t = e.target;
  const tab = t.closest('[data-tab]');
  if (tab) { $('#toast').classList.remove('on'); goTab(tab.dataset.tab); scrollTo(0, 0); return; }
  const pb = t.closest('[data-prop]');
  if (pb) { selectProp(pb.dataset.prop); return; }
  const tool = t.closest('[data-tool]');
  if (tool) { S.tool = S.tool === tool.dataset.tool ? null : tool.dataset.tool; renderTools(); return; }
  if (t.closest('#textBtn')) { openText(); return; }
  const rt = t.closest('[data-rtype]');
  if (rt) { const k = rt.dataset.rtype; if (k === 'h1' || k === 'h2') S.rptHalf = k === 'h1' ? 1 : 2; if (k !== 'm') S.rptYear = S.rptYear || +todayStr().slice(0, 4); S.rptType = k; renderRooms(); return; }
  const rv = t.closest('[data-rview]');
  if (rv) { S.roomView = rv.dataset.rview; renderRooms(); return; }
  const lc = t.closest('[data-lcat]');
  if (lc) { S.logCat = lc.dataset.lcat; renderLogs(); return; }
  if (t.closest('#newLog')) { openLogForm(null); return; }
  const li = t.closest('[data-logid]');
  if (li) { openLogForm(+li.dataset.logid); return; }
  const lr = t.closest('[data-logroom]');
  if (lr) { openLogForm(null, lr.dataset.logroom); return; }
  const tr = t.closest('[data-open]');
  if (tr) { openRoom(tr.dataset.open); return; }
  const pl = t.closest('.plate');
  if (pl) {
    const room = pl.dataset.room;
    const tl = TOOLS.find((x) => x.id === S.tool);
    if (tl) apply([room], tl.clear ? { clear: true } : tl.kind ? { kind: tl.kind } : { status: tl.status }, tl.label);
    else openRoom(room);
    return;
  }
  const bk = t.closest('[data-book]');
  if (bk) { S.bookKey = bk.dataset.book; renderBook(); return; }
  const ed = t.closest('[data-edit]');
  if (ed) { openEdit(ed.dataset.edit); return; }
  const ri = t.closest('[data-rinfo]');
  if (ri && S.admin) { openRoomInfo(ri.dataset.rinfo); return; }
  if (t.closest('#editRoomList')) { openRoomList(); return; }
});
$('#prevDay').onclick = () => shiftDate(-1);
$('#rptPrev').onclick = () => shiftMonth(-1);
$('#rptNext').onclick = () => shiftMonth(1);
$('#nextDay').onclick = () => shiftDate(1);
$('#goToday').onclick = () => { S.date = todayStr(); refresh(); };
async function shiftDate(n) { S.date = addDays(S.date, n); refresh(); }
// 貳侶只有：清理、故障、早餐、評論、報表；其他館：今日、手冊、報表
const tabVis = (b, p) => (!b.dataset.for || b.dataset.for === (p === 'erlu' ? 'erlu' : 'std')) && (!b.dataset.only || b.dataset.only.split(',').includes(p));
function tabsFor(p) { return [...document.querySelectorAll('nav.tabs button')].filter((b) => tabVis(b, p)).map((b) => b.dataset.tab); }
function goTab(t) {
  const ok = tabsFor(S.prop);
  if (!ok.includes(t)) t = ok[0];
  S.tab = t;
  if (t === 'rooms') S.reports = {};
  if (t === 'clean') S.logCat = '清理';
  else if (t === 'fault') S.logCat = '故障';
  else if (t === 'log' && (S.logCat === '清理' || S.logCat === '故障')) S.logCat = '';
  document.querySelectorAll('nav.tabs button').forEach((b) => { b.hidden = !tabVis(b, S.prop); b.toggleAttribute('aria-current', b.dataset.tab === t); if (b.dataset.tab === t) b.setAttribute('aria-current', 'page'); });
  const sec = { clean: 'log', fault: 'log' }[t] || t;
  document.querySelectorAll('section.page').forEach((x) => x.classList.toggle('on', x.id === 'p-' + sec));
  renderAll();
}
async function selectProp(p) {
  S.prop = p; ls.set('eroom.prop', p);
  document.querySelectorAll('[data-prop]').forEach((b) => b.setAttribute('aria-pressed', b.dataset.prop === p));
  if (!S.rooms[p]) await loadRooms(p).catch(() => {});
  S.reports = {};
  goTab(S.tab);
  refresh();
}
async function refresh() {
  try { history.replaceState(null, '', `?p=${S.prop}&d=${S.date}`); } catch {}
  renderAll();
  try { await loadRecs(); $('#offline').classList.remove('on'); } catch { $('#offline').classList.add('on'); }
  renderAll();
}
function renderAll() {
  if (S.tab === 'today') { renderTools(); renderToday(); }
  if (S.tab === 'log' || S.tab === 'clean' || S.tab === 'fault') renderLogs();
  if (S.tab === 'bf') renderBf();
  if (S.tab === 'rev') renderRev();
  if (S.tab === 'deep') renderDeep();
  if (S.tab === 'book') renderBook();
  if (S.tab === 'rooms') renderRooms();
}
// 回到畫面時更新（別人改過的會同步進來）
document.addEventListener('visibilitychange', () => { if (!document.hidden && S.tab === 'today' && !S.pending.length) refresh(); });
setInterval(() => { if (!document.hidden && S.tab === 'today' && !S.pending.length && !$('#sheet').classList.contains('on')) loadRecs().then(() => renderToday()).catch(() => {}); }, 30000);

// ---------- 啟動 ----------
(async function init() {
  const q = new URLSearchParams(location.search);
  if (PROPS[q.get('p')]) S.prop = q.get('p');
  if (/^\d{4}-\d{2}-\d{2}$/.test(q.get('d') || '')) S.date = q.get('d');
  if (q.get('deep')) { S.tab = 'deep'; S.deepTask = +q.get('deep') || 0; }
  renderLock();
  document.querySelectorAll('[data-prop]').forEach((b) => b.setAttribute('aria-pressed', b.dataset.prop === S.prop));
  goTab(S.tab);
  await Promise.all([loadRooms('ersu'), loadRooms('eryanglou'), loadRooms('erlu'), loadDocs()].map((p) => p.catch(() => {})));
  if (S.admin) api('admin', { method: 'POST' }).catch(() => { S.admin = ''; ss.set('eroom.admin', ''); renderLock(); });
  flush();
  refresh();
})();
</script>
