<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#1f2a2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="房務">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-180.png">
<title>貳宿｜房務</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --linen:#eceeea; --sheet:#f8f9f6; --ink:#1f2a2e; --ink2:#55626a; --line:#d3d8d3;
  --todo:#e0a21b; --prio:#c9402c; --done:#2e8b6a; --in:#3f6fb0; --none:#9aa3a6;
  --r:10px; --plate:'Barlow Condensed','Noto Sans TC',sans-serif;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--linen);color:var(--ink);font:15px/1.6 'Noto Sans TC',system-ui,sans-serif}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--in);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding:0 16px calc(92px + var(--safe-b))}

/* 頂部 */
header{position:sticky;top:0;z-index:20;background:var(--ink);color:#f3f4f0;padding:calc(env(safe-area-inset-top,0px) + 10px) 0 10px}
header .in{max-width:760px;margin:0 auto;padding:0 16px;display:flex;align-items:center;gap:10px}
.brand{font-family:var(--plate);font-weight:700;font-size:22px;letter-spacing:.06em}
.props{display:flex;background:rgba(255,255,255,.1);border-radius:999px;padding:3px;margin-left:auto}
.props button{border:0;background:none;color:#cfd6d6;padding:5px 14px;border-radius:999px;font-weight:500}
.props button[aria-pressed=true]{background:#f3f4f0;color:var(--ink)}
.lock{border:0;background:none;color:#cfd6d6;font-size:18px;padding:4px 6px;line-height:1}
.lock.on{color:var(--todo)}

/* 底部分頁 */
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:20;background:var(--sheet);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:var(--safe-b)}
nav.tabs button{flex:1;max-width:190px;border:0;background:none;padding:10px 0 12px;color:var(--ink2);font-size:13px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs svg{width:22px;height:22px}
nav.tabs button[aria-current=page]{color:var(--ink);font-weight:700}
nav.tabs button{position:relative}
#issueBadge:not(:empty){position:absolute;top:5px;left:calc(50% + 6px);background:var(--prio);color:#fff;border-radius:999px;font-size:11px;font-weight:700;padding:0 6px;line-height:17px}
.pick{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font-weight:500}
.pick input{display:none}
nav.tabs button[aria-current=page] svg{stroke-width:2.2}

section.page{display:none}
section.page.on{display:block}
h2{font-size:18px;margin:22px 0 10px}
.muted{color:var(--ink2)}
.small{font-size:13px}

/* 日期列 */
.dayrow{display:flex;align-items:center;gap:8px;margin:16px 0 4px}
.dayrow .date{font-family:var(--plate);font-size:30px;font-weight:700;line-height:1}
.dayrow .wk{color:var(--ink2);font-size:14px}
.dayrow .today{margin-left:6px;font-size:12px;border:1px solid var(--ink);border-radius:999px;padding:1px 9px;background:none}
.dayrow .nav{margin-left:auto;display:flex;gap:6px}
.iconbtn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--sheet);display:grid;place-items:center;font-size:18px}

.counts{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 12px;font-size:14px}
.counts b{font-family:var(--plate);font-size:22px;margin-right:3px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:1px}

/* 快速標記工具列 */
.tools{position:sticky;top:58px;z-index:10;background:var(--linen);padding:8px 0 10px;margin:0 -16px;padding-left:16px;padding-right:16px;border-bottom:1px solid var(--line)}
.tools .hint{font-size:13px;color:var(--ink2);margin-bottom:6px;min-height:20px}
.tools .row{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.tools .row::-webkit-scrollbar{display:none}
.tool{flex:none;border:1.5px solid var(--line);background:var(--sheet);border-radius:999px;padding:6px 13px;font-weight:500;white-space:nowrap}
.tool i{font-style:normal;display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.tool[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.tool.text{margin-left:auto;border-style:dashed}

/* 房號門牌 */
.floor{display:flex;gap:10px;align-items:flex-start;margin-top:14px}
.floor .fl{width:26px;flex:none;font-family:var(--plate);font-weight:700;color:var(--ink2);font-size:15px;padding-top:12px;text-align:right}
.grid{flex:1;display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.plate{position:relative;border:0;border-radius:var(--r);background:var(--sheet);box-shadow:inset 0 0 0 1px var(--line);padding:8px 9px 9px;text-align:left;min-height:84px;display:flex;flex-direction:column;justify-content:space-between}
.plate .no{font-family:var(--plate);font-size:30px;font-weight:700;line-height:1}
.plate .kd{font-size:12.5px;font-weight:700;line-height:1.3}
.plate .st{font-size:12px;color:var(--ink2);line-height:1.3}
.plate .tag{position:absolute;top:0;right:12px;width:14px;height:22px;border-radius:0 0 3px 3px}
.plate.k-退房 .tag,.plate.k-續住.s-todo .tag{background:var(--todo)}
.plate.k-退入 .tag{background:var(--prio)}
.plate.k-入住 .tag{background:var(--in)}
.plate.s-done{background:#e3efe9;box-shadow:inset 0 0 0 1.5px var(--done)}
.plate.s-done .tag{background:var(--done)}
.plate.s-done .no{color:var(--done)}
.plate.s-todo{box-shadow:inset 0 0 0 1.5px var(--todo)}
.plate.k-退入.s-todo{box-shadow:inset 0 0 0 2px var(--prio)}
.plate .mini{position:absolute;bottom:8px;right:9px;font-size:11px;color:var(--ink2)}
.plate.flash{animation:flash .5s}
@keyframes flash{from{transform:scale(.94)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.plate.flash{animation:none}}

.list{background:var(--sheet);border-radius:var(--r);box-shadow:inset 0 0 0 1px var(--line);overflow:hidden}
.list .it{display:flex;align-items:center;gap:12px;padding:10px 14px;border-top:1px solid var(--line)}
.list .it:first-child{border-top:0}
.list .it .no{font-family:var(--plate);font-size:24px;font-weight:700;width:52px}
.list .it .ck{margin-left:auto;border:1.5px solid var(--done);color:var(--done);background:none;border-radius:999px;padding:4px 12px;font-weight:500}
.list .it.done .ck{background:var(--done);color:#fff}
.empty{padding:18px 14px;color:var(--ink2)}

/* 抽屜 */
.scrim{position:fixed;inset:0;background:rgba(20,28,30,.45);z-index:40;display:none}
.scrim.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--sheet);border-radius:18px 18px 0 0;max-height:88vh;overflow:auto;transform:translateY(105%);transition:transform .22s ease;padding:8px 18px calc(22px + var(--safe-b))}
.sheet.on{transform:none}
@media (prefers-reduced-motion:reduce){.sheet{transition:none}}
.sheet .grab{width:42px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 10px}
.sheet h3{margin:0;font-family:var(--plate);font-size:40px;line-height:1}
.sheet .sub{color:var(--ink2);font-size:13px;margin-bottom:12px}
.lbl{font-size:13px;color:var(--ink2);margin:14px 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{white-space:nowrap;flex:none;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font-weight:500}
.chip[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
.chip.c-done[aria-pressed=true]{background:var(--done);border-color:var(--done)}
.chip.c-todo[aria-pressed=true]{background:var(--todo);border-color:var(--todo);color:var(--ink)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
input[type=time],input[type=text],input[type=password],textarea,select{width:100%;border:1.5px solid var(--line);border-radius:8px;background:#fff;padding:9px 11px}
textarea{min-height:90px;resize:vertical;line-height:1.6}
.checks label{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px dashed var(--line)}
.checks label:first-child{border-top:0}
.checks input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--done);flex:none}
.checks .prog{font-size:13px;color:var(--done);font-weight:700}
.btnrow{display:flex;gap:8px;margin-top:18px}
.btn{border:0;border-radius:10px;padding:11px 18px;font-weight:700;background:var(--ink);color:#fff}
.btn.ghost{background:none;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.wide{flex:1}

/* 手冊等內容 */
.subtabs{display:flex;gap:6px;overflow-x:auto;margin:16px 0 6px;scrollbar-width:none}
.subtabs::-webkit-scrollbar{display:none}
.doc{background:var(--sheet);border-radius:var(--r);box-shadow:inset 0 0 0 1px var(--line);padding:6px 18px 16px}
.doc h3{font-size:17px;margin:18px 0 6px}
.doc h4{font-size:15px;margin:14px 0 4px}
.doc ul,.doc ol{padding-left:20px;margin:6px 0}
.doc li{margin:3px 0}
.doc p{margin:8px 0}
.meta{display:flex;align-items:center;gap:8px;margin:10px 0;font-size:13px;color:var(--ink2)}
.meta .btn{margin-left:auto;padding:7px 14px;font-size:14px}
.draft{background:#fbf1d6;color:#7a5a07;border-radius:6px;padding:1px 8px;font-size:12px}

.supply{background:var(--sheet);border-radius:var(--r);box-shadow:inset 0 0 0 1px var(--line);margin-bottom:12px;overflow:hidden}
.supply h3{margin:0;padding:12px 16px;font-size:16px;border-bottom:1px solid var(--line);display:flex;align-items:baseline;gap:8px}
.supply h3 span{font-weight:400;color:var(--ink2);font-size:13px}
.supply table{width:100%;border-collapse:collapse}
.supply td{padding:8px 16px;border-top:1px solid var(--line);vertical-align:top}
.supply tr:first-child td{border-top:0}
.supply td.q{font-family:var(--plate);font-size:19px;font-weight:700;width:1%;white-space:nowrap;text-align:right}
.supply td.n{color:var(--ink2);font-size:13px}

.rcard{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-top:1px solid var(--line);background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left}
.rcard:first-child{border-top:0}
.rcard .no{font-family:var(--plate);font-size:26px;font-weight:700;width:52px;flex:none;line-height:1.1}
.rcard .tp{font-weight:700}
.rcard .nt{color:var(--ink2);font-size:13px}

.issue{background:var(--sheet);border-radius:var(--r);box-shadow:inset 0 0 0 1px var(--line);padding:12px 14px;margin-bottom:10px}
.issue .hd{display:flex;align-items:baseline;gap:8px}
.issue .hd .no{font-family:var(--plate);font-size:26px;font-weight:700;line-height:1}
.issue .ty{font-size:12px;font-weight:700;border-radius:4px;padding:1px 7px;background:#e7ebe7}
.issue .ty.t-故障{background:#f6dcd7;color:#8f2a1b}.issue .ty.t-缺備品{background:#fbedc9;color:#7a5a07}.issue .ty.t-遺留物{background:#dbe5f3;color:#2c4f84}
.issue .tm{margin-left:auto;font-size:12px;color:var(--ink2);text-align:right}
.issue .tx{margin:6px 0 0;white-space:pre-wrap}
.issue .its{margin:6px 0 0;font-size:14px}
.issue .ph{display:flex;gap:6px;margin-top:8px}
.issue .ph img{width:76px;height:76px;object-fit:cover;border-radius:8px;background:#ddd}
.issue .ft{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:13px;color:var(--ink2)}
.issue .ft .btn{margin-left:auto;padding:7px 14px;font-size:14px;background:var(--done)}
.issue.done{opacity:.72}.issue.done .ft .btn{background:none;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.addbtn{width:100%;margin:16px 0 4px;padding:13px;border-radius:var(--r);border:1.5px dashed var(--ink2);background:none;font-weight:700}
.restock{background:#fbf1d6;border-radius:var(--r);padding:10px 16px;margin-bottom:14px}
.restock h3{margin:4px 0 6px;font-size:16px}
.restock table{width:100%;border-collapse:collapse}.restock td{padding:5px 0;border-top:1px solid #ecd9a3;vertical-align:top}
.restock tr:first-child td{border-top:0}.restock td.q{font-family:var(--plate);font-size:19px;font-weight:700;text-align:right;white-space:nowrap;width:1%;padding-left:10px}
.restock td.r{color:#7a5a07;font-size:13px}
.qty{display:flex;align-items:center;gap:6px}.qty button{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line);background:#fff;font-weight:700}
.qty b{min-width:20px;text-align:center;font-family:var(--plate);font-size:18px}
.sitem{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px dashed var(--line)}.sitem:first-child{border-top:0}
.sitem label{flex:1;display:flex;gap:8px;align-items:center}.sitem input{width:20px;height:20px;accent-color:var(--todo)}
.thumbs{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.thumbs img{width:64px;height:64px;object-fit:cover;border-radius:8px}
.plate .warn{position:absolute;top:6px;left:auto;right:32px;font-size:13px}
.counts a{color:var(--prio);font-weight:700;text-decoration:none}
.rpt-nav{display:flex;align-items:center;gap:8px;margin:6px 0 10px}
.rpt-nav .mo{font-family:var(--plate);font-size:28px;font-weight:700}
.rpt-nav .nav{margin-left:auto;display:flex;gap:6px}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px;margin-bottom:14px}
.stat{background:var(--sheet);border-radius:var(--r);box-shadow:inset 0 0 0 1px var(--line);padding:10px 12px}
.stat b{display:block;font-family:var(--plate);font-size:28px;line-height:1.1}
.stat span{font-size:12.5px;color:var(--ink2)}
.bars{display:flex;align-items:flex-end;gap:2px;height:120px;background:var(--sheet);border-radius:var(--r);box-shadow:inset 0 0 0 1px var(--line);padding:10px 10px 22px;position:relative}
.bars .b{flex:1;position:relative;height:100%;display:flex;flex-direction:column;justify-content:flex-end}
.bars .b i{display:block;background:var(--todo);border-radius:2px 2px 0 0}
.bars .b i.d{background:var(--done);border-radius:0}
.bars .b em{position:absolute;bottom:-18px;left:50%;transform:translateX(-50%);font-size:10px;font-style:normal;color:var(--ink2)}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--ink2);margin:6px 0 0}
.rtable{width:100%;border-collapse:collapse;background:var(--sheet);border-radius:var(--r);overflow:hidden;box-shadow:inset 0 0 0 1px var(--line);font-size:14px}
.rtable th,.rtable td{padding:7px 8px;text-align:right;border-top:1px solid var(--line);white-space:nowrap}
.rtable th{font-size:12px;color:var(--ink2);font-weight:500;border-top:0}
.rtable td:first-child,.rtable th:first-child{text-align:left;font-family:var(--plate);font-size:18px;font-weight:700}
.rtable th:first-child{font-family:inherit;font-size:12px}
.rtable tr.sum td{font-weight:700;background:#eef1ed}
.tablewrap{overflow-x:auto}
.toast{white-space:nowrap;position:fixed;left:50%;bottom:calc(84px + var(--safe-b));transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:999px;padding:9px 8px 9px 18px;z-index:60;display:none;align-items:center;gap:10px;font-size:14px;max-width:92vw}
.toast.on{display:flex}
.toast button{border:0;background:rgba(255,255,255,.14);color:#fff;border-radius:999px;padding:4px 12px}
.toast.err{background:var(--prio);padding-right:18px}
.offline{background:var(--prio);color:#fff;text-align:center;font-size:13px;padding:4px;display:none}
.offline.on{display:block}
</style>
</head>
<body>
<header>
  <div class="in">
    <span class="brand">E·ROOM</span>
    <div class="props" role="group" aria-label="館別">
      <button data-prop="ersu">貳宿</button>
      <button data-prop="eryanglou">貳洋樓</button>
    </div>
    <button class="lock" id="lockBtn" aria-label="管理員登入" title="管理員">🔒</button>
  </div>
</header>
<div class="offline" id="offline">連不到伺服器，改動會在恢復連線後重送</div>

<main class="wrap">
  <!-- 今日 -->
  <section class="page on" id="p-today">
    <div class="dayrow">
      <span class="date" id="dDate"></span><span class="wk" id="dWk"></span>
      <button class="today" id="goToday" hidden>回今天</button>
      <div class="nav">
        <button class="iconbtn" id="prevDay" aria-label="前一天">‹</button>
        <button class="iconbtn" id="nextDay" aria-label="後一天">›</button>
      </div>
    </div>
    <div class="counts" id="counts"></div>

    <div class="tools">
      <div class="hint" id="toolHint">選一個標記，再點房號，可以連續點好幾間</div>
      <div class="row" id="toolRow"></div>
    </div>

    <div id="floors"></div>

    <h2>今日要掃</h2>
    <div class="list" id="todoList"></div>
  </section>

  <!-- 回報 -->
  <section class="page" id="p-issue">
    <button class="addbtn" id="newIssue">＋ 回報問題（故障、缺備品、遺留物）</button>
    <div class="subtabs" id="issueTabs"></div>
    <div id="issueBody"></div>
  </section>

  <!-- 手冊 -->
  <section class="page" id="p-book">
    <div class="subtabs" id="bookTabs"></div>
    <div class="meta" id="bookMeta"></div>
    <div class="doc" id="bookBody"></div>
  </section>

  <!-- 備品 -->
  <section class="page" id="p-supply">
    <div class="meta" id="supplyMeta" style="margin-top:16px"></div>
    <div id="supplyBody"></div>
  </section>

  <!-- 房間 -->
  <section class="page" id="p-rooms">
    <div class="subtabs" id="roomTabs"></div>
    <div id="rptWrap">
      <div class="rpt-nav"><span class="mo" id="rptMo"></span>
        <div class="nav"><button class="iconbtn" id="rptPrev" aria-label="上個月">‹</button><button class="iconbtn" id="rptNext" aria-label="下個月">›</button></div></div>
      <div id="rptBody"></div>
    </div>
    <div id="infoWrap">
      <div class="meta" id="roomsMeta"></div>
      <div class="list" id="roomsBody"></div>
    </div>
  </section>
</main>

<nav class="tabs" aria-label="主選單">
  <button data-tab="today" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>今日</button>
  <button data-tab="issue"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 3l9 16H3z"/><path d="M12 10v4M12 17v.5"/></svg>回報<span id="issueBadge"></span></button>
  <button data-tab="book"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M5 4h10a4 4 0 0 1 4 4v12H9a4 4 0 0 1-4-4z"/><path d="M9 9h6M9 13h6"/></svg>手冊</button>
  <button data-tab="supply"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 8l8-4 8 4v8l-8 4-8-4z"/><path d="M4 8l8 4 8-4M12 12v8"/></svg>備品</button>
  <button data-tab="rooms"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 21V4h12v17M3 21h18"/><circle cx="14.5" cy="12.5" r="1"/></svg>報表</button>
</nav>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"><div class="grab"></div><div id="sheetBody"></div></div>
<div class="toast" id="toast" role="status"><span id="toastMsg"></span><button id="toastUndo">復原</button></div>

<script>
'use strict';
const PROPS = { ersu: '貳宿', eryanglou: '貳洋樓' };
// kind（存檔值）→ 顯示
const KINDS = {

// ---------- 狀態 ----------
const ls = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
const ss = {
  get(k) { try { return sessionStorage.getItem(k) || ''; } catch { return ''; } },
  set(k, v) { try { v ? sessionStorage.setItem(k, v) : sessionStorage.removeItem(k); } catch {} },
};
const S = {
  prop: ls.get('eroom.prop', 'ersu'),
  date: todayStr(),
  rooms: {},     // prop -> [rooms]
  recs: {},      // `${prop}|${date}` -> {room: data}
  docs: {},
  tool: null,
  tab: 'today',
  bookKey: 'handbook',
  admin: ss.get('eroom.admin'),
  pending: ls.get('eroom.pending', []),
  issues: [], issueFilter: 'open', roomView: 'report', month: todayStr().slice(0, 7), reports: {}, me: ls.get('eroom.me', ''),
};

function todayStr(d = new Date()) {
  const t = new Date(d.getTime() + 8 * 3600e3); // 台灣時間
  return t.toISOString().slice(0, 10);
}
function addDays(s, n) { const d = new Date(s + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); }
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const key = () => S.prop + '|' + S.date;
const recs = () => (S.recs[key()] ||= {});

// ---------- API ----------
async function api(path, opts = {}) {
  const headers = { 'content-type': 'application/json' };
  if (S.admin) headers['x-admin'] = S.admin;
  const r = await fetch('/api/' + path, { ...opts, headers });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw Object.assign(new Error(j.error || ('HTTP ' + r.status)), { status: r.status });
  return j;
}
async function loadRooms(p) {
  const j = await api('config?p=' + p);
  S.rooms[p] = j.config.rooms || [];
}
async function loadRecs(p = S.prop, d = S.date) {
  const j = await api('records?p=' + p + '&d=' + d);
  S.recs[p + '|' + d] = j.records || {};
}
async function loadDocs() {
  const j = await api('docs');
  S.docs = j.docs || {};
}
async function loadIssues() {
  const j = await api('issues?status=' + (S.issueFilter === 'open' ? 'open' : 'all') + '&limit=150');
  S.issues = j.issues || [];
  if (S.issueFilter === 'open') S.openIssues = S.issues; else S.openIssues = S.issues.filter((i) => i.status === 'open');
  renderBadge();
}
function renderBadge() {
  const n = (S.openIssues || []).length;
  $('#issueBadge').textContent = n ? String(n) : '';
}
const openFor = (p, r) => (S.openIssues || []).filter((i) => i.prop === p && i.room === r);
const doc = (k) => S.docs[k] || DEFAULTS[k];
const isDraft = (k) => !S.docs[k];

// 寫入：先改畫面，再排隊送出（離線也不會掉）
let flushTimer = null;
function queue(p, d, items) {
  for (const it of items) {
    const i = S.pending.findIndex((x) => x.p === p && x.d === d && x.room === it.room);
    // 換成新物件（不要原地修改），送出中的那批才不會把這次的改動一起標成「已送出」
    if (i >= 0) S.pending[i] = { ...S.pending[i], data: { ...S.pending[i].data, ...it.data } };
    else S.pending.push({ p, d, room: it.room, data: it.data });
  }
  ls.set('eroom.pending', S.pending);
  clearTimeout(flushTimer);
  flushTimer = setTimeout(flush, 350);
}
let flushing = false;
async function flush() {
  if (flushing || !S.pending.length) return;
  flushing = true;
  const batch = S.pending.slice();
  const groups = {};
  for (const x of batch) (groups[x.p + '|' + x.d] ||= []).push({ room: x.room, data: x.data });
  try {
    for (const g in groups) {
      const [p, d] = g.split('|');
      await api('records', { method: 'POST', body: JSON.stringify({ p, d, items: groups[g] }) });
    }
    S.pending = S.pending.filter((x) => !batch.includes(x));
    ls.set('eroom.pending', S.pending);
    $('#offline').classList.remove('on');
  } catch (e) {
    $('#offline').classList.add('on');
    setTimeout(flush, 8000);
  } finally { flushing = false; }
}
addEventListener('online', flush);

// ---------- 套用標記 ----------
let undoStack = null;
function apply(rooms, change, label) {
  const R = recs();
  const before = {};
  const items = [];
  for (const room of rooms) {
    const cur = R[room] || {};
    before[room] = { kind: cur.kind || '', status: cur.status || '', note: cur.note || '' };
    let next;
    if (change.full) next = { ...change.full };
    else if (change.clear) next = { kind: '', status: '', note: '' };
    else if (change.kind) next = { kind: change.kind, status: KINDS[change.kind].status };
    else next = { ...change };
    R[room] = { ...cur, ...next };
    items.push({ room, data: next });
  }
  undoStack = { p: S.prop, d: S.date, before };
  queue(S.prop, S.date, items);
  renderToday(rooms);
  toast((label || '已更新') + '：' + rooms.join('、'), true);
}
function undo() {
  if (!undoStack) return;
  const { p, d, before } = undoStack;
  const R = S.recs[p + '|' + d] || {};
  const items = [];
  for (const room in before) { R[room] = { ...R[room], ...before[room] }; items.push({ room, data: before[room] }); }
  queue(p, d, items);
  undoStack = null;
  renderToday();
  toast('已復原');
}

// ---------- 今日畫面 ----------
function floorOf(r) { return r.length >= 3 ? r.slice(0, -2) : r.slice(0, 1); }
function needsClean(d) { return d && d.status === 'todo'; }
function kindText(d) {
  if (!d || !d.kind) return '';
  if (d.kind === '續住') return d.status === 'todo' ? '續住要掃' : (d.status === 'done' ? '續住' : '續住不用掃');
  if (d.kind === '退房') return '退房要掃';
  if (d.kind === '退入') return '退房→入住';
  return KINDS[d.kind]?.label || d.kind;
}
function renderToday(flashRooms = []) {
  const d = new Date(S.date + 'T00:00:00Z');
  $('#dDate').textContent = (d.getUTCMonth() + 1) + '/' + d.getUTCDate();
  $('#dWk').textContent = '週' + WK[d.getUTCDay()];
  $('#goToday').hidden = S.date === todayStr();

  const rooms = S.rooms[S.prop] || [];
  const R = recs();
  let todo = 0, done = 0, inn = 0, prio = 0;
  for (const r of rooms) {
    const x = R[r]; if (!x) continue;
    if (x.status === 'todo') { todo++; if (x.kind === '退入') prio++; }
    if (x.status === 'done') done++;
    if (x.kind === '入住' || x.kind === '退入') inn++;
  }
  $('#counts').innerHTML =
    `<span><i class="dot" style="background:var(--todo)"></i><b>${todo}</b>要掃${prio ? `（優先 ${prio}）` : ''}</span>` +
    `<span><i class="dot" style="background:var(--done)"></i><b>${done}</b>掃好了</span>` +
    `<span><i class="dot" style="background:var(--in)"></i><b>${inn}</b>今晚入住</span>` +
    ((S.openIssues || []).length ? `<a href="#" data-goissue>⚠️ ${(S.openIssues || []).length} 件回報待處理</a>` : '');

  // 依樓層
  const fl = {};
  for (const r of rooms) (fl[floorOf(r)] ||= []).push(r);
  $('#floors').innerHTML = rooms.length ? Object.keys(fl).map((f) =>
    `<div class="floor"><div class="fl">${esc(f)}F</div><div class="grid">${fl[f].map((r) => plate(r, R[r], flashRooms.includes(r))).join('')}</div></div>`
  ).join('') : `<p class="empty">這館還沒有房號。到「房間」分頁設定（需要管理員）。</p>`;

  // 要掃清單：優先 → 退房 → 續住
  const order = { '退入': 0, '退房': 1, '續住': 2 };
  const list = rooms.filter((r) => R[r] && (R[r].status === 'todo' || R[r].status === 'done') && R[r].kind !== '入住')
    .sort((a, b) => (R[a].status === 'done') - (R[b].status === 'done') || (order[R[a].kind] ?? 3) - (order[R[b].kind] ?? 3) || a.localeCompare(b));
  $('#todoList').innerHTML = list.length ? list.map((r) => {
    const x = R[r];
    const extra = [x.lateOut && '延後退房 ' + x.lateOut, x.earlyIn && '提早入住 ' + x.earlyIn, x.note].filter(Boolean).join('・');
    return `<div class="it ${x.status === 'done' ? 'done' : ''}"><span class="no">${esc(r)}</span>
      <div><div style="font-weight:700;color:${x.kind === '退入' ? 'var(--prio)' : 'inherit'}">${esc(kindText(x))}</div>${extra ? `<div class="small muted">${esc(extra)}</div>` : ''}</div>
      <button class="ck" data-done="${esc(r)}">${x.status === 'done' ? '✓ 掃好了' : '掃好了'}</button></div>`;
  }).join('') : `<div class="empty">今天沒有要掃的房間。用上面的標記點房號就能加入。</div>`;
}
function plate(r, x, flash) {
  x = x || {};
  const cls = ['plate', x.kind ? 'k-' + x.kind : '', x.status ? 's-' + x.status : '', flash ? 'flash' : ''].join(' ');
  const st = x.kind ? (x.status === 'done' ? '✓ 掃好了' : (x.kind === '入住' ? '' : STATUS[x.status || ''])) : '空房';
  const mini = [x.lateOut && '晚退', x.earlyIn && '早入', x.note && '✎'].filter(Boolean).join(' ');
  const warn = openFor(S.prop, r).length;
  return `<button class="${cls}" data-room="${esc(r)}" aria-label="${esc(r)} ${esc(kindText(x) || '空房')}">
    ${x.kind ? '<span class="tag"></span>' : ''}${warn ? '<span class="warn" title="有未處理的回報">⚠️</span>' : ''}<span class="no">${esc(r)}</span>
    <span><span class="kd">${esc(x.kind ? (KINDS[x.kind]?.label || x.kind) : '')}</span><br><span class="st">${esc(st)}</span></span>
    ${mini ? `<span class="mini">${esc(mini)}</span>` : ''}</button>`;
}

function renderTools() {
  $('#toolRow').innerHTML = TOOLS.map((t) =>
    `<button class="tool" data-tool="${t.id}" aria-pressed="${S.tool === t.id}"><i style="background:${t.color}"></i>${t.label}</button>`
  ).join('') + `<button class="tool text" id="textBtn">貼上文字</button>`;

// ---------- 房間抽屜 ----------
function openRoom(room) {
  const R = recs();
  const x = { ...(R[room] || {}) };
  const info = (doc('roominfo').rooms || {})[S.prop + ':' + room] || {};
  const cl = doc('checklist');
  const draw = () => {
    const list = x.kind === '續住' ? cl.stay : (x.kind === '退房' || x.kind === '退入') ? cl.checkout : [];
    const checks = new Set(x.checks || []);
    $('#sheetBody').innerHTML = `
      <h3>${esc(room)}</h3>
      <div class="sub">${esc(PROPS[S.prop])}・${esc(S.date.slice(5).replace('-', '/'))}${info.type ? '・' + esc(info.type) : ''}${info.note ? '<br>' + esc(info.note) : ''}</div>
      <div class="lbl">今天這間</div>
      <div class="chips">${Object.keys(KINDS).map((k) => `<button class="chip" data-k="${k}" aria-pressed="${x.kind === k}">${KINDS[k].label}</button>`).join('')}
        <button class="chip" data-k="" aria-pressed="${!x.kind}">空房</button></div>
      ${x.kind ? `<div class="lbl">打掃</div>
      <div class="chips">${['todo', 'done', ''].map((s) => `<button class="chip c-${s || 'none'}" data-s="${s}" aria-pressed="${(x.status || '') === s}">${STATUS[s]}</button>`).join('')}</div>` : ''}
      ${list.length ? `<div class="lbl">檢核 <span class="checks"><span class="prog">${[...checks].filter((i) => i < list.length).length}/${list.length}</span></span></div>
      <div class="checks">${list.map((t, i) => `<label><input type="checkbox" data-c="${i}" ${checks.has(i) ? 'checked' : ''}>${esc(t)}</label>`).join('')}</div>` : ''}
      ${x.kind ? `<div class="two" style="margin-top:4px">
        <div><div class="lbl">延後退房</div><input type="time" id="fLate" value="${esc(x.lateOut || '')}"></div>
        <div><div class="lbl">提早入住</div><input type="time" id="fEarly" value="${esc(x.earlyIn || '')}"></div></div>` : ''}
      <div class="lbl">備註（勿擾、缺備品、故障、遺留物⋯）</div>
      <textarea id="fNote" placeholder="例如：浴室燈不亮">${esc(x.note || '')}</textarea>
      ${openFor(S.prop, room).length ? `<div class="lbl">這間未處理的回報</div>${openFor(S.prop, room).map((i) => `<div class="small">⚠️ ${esc(i.type)}：${esc(i.text || i.items.map((t) => t.name + '×' + t.qty).join('、'))}</div>`).join('')}` : ''}
      <button class="addbtn" id="sIssue" style="margin-top:14px">＋ 回報這間的問題</button>
      <div class="btnrow"><button class="btn ghost" id="sClose">取消</button><button class="btn wide" id="sSave">儲存</button></div>`;
  };
  draw();
  const body = $('#sheetBody');
  body.onclick = (e) => {
    const k = e.target.closest('[data-k]');
    if (k) { x.kind = k.dataset.k; x.status = x.kind ? KINDS[x.kind].status : ''; if (!x.kind) { x.lateOut = ''; x.earlyIn = ''; } keepFields(); return draw(); }
    const s = e.target.closest('[data-s]');
    if (s) { x.status = s.dataset.s; keepFields(); return draw(); }
    if (e.target.id === 'sClose') return closeSheet();
    if (e.target.id === 'sIssue') return openIssueForm(room);
    if (e.target.id === 'sSave') {
      keepFields();
      const data = { kind: x.kind || '', status: x.status || '', note: x.note || '', lateOut: x.lateOut || '', earlyIn: x.earlyIn || '', checks: x.checks || [] };
      apply([room], { full: data }, '已儲存');
      closeSheet();
    }
  };
  body.onchange = (e) => {
    if (e.target.dataset.c != null) {
      const set = new Set(x.checks || []);
      const i = +e.target.dataset.c;
      e.target.checked ? set.add(i) : set.delete(i);
      x.checks = [...set].sort((a, b) => a - b);
      keepFields(); draw();
    }
  };
  function keepFields() {
    const n = $('#fNote'), l = $('#fLate'), er = $('#fEarly');
    if (n) x.note = n.value; if (l) x.lateOut = l.value; if (er) x.earlyIn = er.value;
  }
  openSheet();
}

// ---------- 貼上文字快速輸入 ----------
const WORDS = [
  [/退房?\s*(→|->|接|轉)\s*入住?|退入|退房入住/, { kind: '退入' }],
  [/續住?/, { kind: '續住' }],
  [/退房?/, { kind: '退房' }],
  [/入住?/, { kind: '入住' }],
  [/掃好了?|完成|好了/, { status: 'done' }],
  [/不用掃|免掃/, { status: '' }],
  [/清空|清除|取消/, { clear: true }],
];
function parseText(text, rooms) {
  const out = []; let cur = null;
  const set = new Set(rooms.map((r) => r.toUpperCase()));
  const tokens = text.replace(/[，,、；;：:\n\/]+/g, ' ').split(/\s+/).filter(Boolean);
  for (let tk of tokens) {
    // 「退房201」這種黏在一起的也拆開
    const m = tk.match(/^([^\dA-Za-z]+)?([\dA-Za-z]+)?$/);
    const word = m ? m[1] : tk, num = m ? m[2] : null;

// ---------- 簡易 markdown ----------
function md(src) {
  const lines = String(src || '').split('\n'); let h = ''; let list = null;
  const inline = (s) => esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
  const close = () => { if (list) { h += `</${list}>`; list = null; } };
  for (const ln of lines) {
    let m;
    if ((m = ln.match(/^###\s+(.*)/))) { close(); h += `<h3>${inline(m[1])}</h3>`; }
    else if ((m = ln.match(/^####\s+(.*)/))) { close(); h += `<h4>${inline(m[1])}</h4>`; }
    else if ((m = ln.match(/^\s*[-*]\s+(.*)/))) { if (list !== 'ul') { close(); h += '<ul>'; list = 'ul'; } h += `<li>${inline(m[1])}</li>`; }
    else if ((m = ln.match(/^\s*\d+[.、]\s*(.*)/))) { if (list !== 'ol') { close(); h += '<ol>'; list = 'ol'; } h += `<li>${inline(m[1])}</li>`; }
    else if (ln.trim()) { close(); h += `<p>${inline(ln)}</p>`; }
    else close();
  }
  close(); return h;
}

function parseSupplies(text) {
  const groups = []; let g = null;
  for (const ln of String(text || '').split('\n')) {
    let m;
    if ((m = ln.match(/^##\s+(.*)/))) { g = { name: m[1].trim(), items: [] }; groups.push(g); }
    else if ((m = ln.match(/^\s*[-*]\s+(.*)/))) {
      if (!g) { g = { name: '通用', items: [] }; groups.push(g); }
      const [name, qty = '', note = ''] = m[1].split('|').map((s) => s.trim());
      g.items.push({ name, qty, note });
    }
  }
  return groups;
}

// 照片壓縮成長邊 1280px 的 JPEG
function shrink(file) {
  return new Promise((res, rej) => {
    const img = new Image(); const url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, 1280 / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      res(c.toDataURL('image/jpeg', 0.72));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('這張照片讀不到，換一張試試')); };
    img.src = url;
  });
}

}
function openIssueForm(room) {
  const rooms = S.rooms[S.prop] || [];
  const f = { room: room || '', type: room ? '' : '', text: '', items: {}, photos: [], extra: '' };
  const draw = () => {
    const names = f.room ? supplyItemsFor(f.room) : [];
    $('#sheetBody').innerHTML = `<h3 style="font-size:24px;font-family:inherit">回報問題</h3><div class="sub">${esc(PROPS[S.prop])}。送出後會出現在「回報」，管理員處理好再按掉。</div>
      <div class="lbl">房號</div>
      <select id="qRoom"><option value="">選房號</option>${rooms.map((r) => `<option ${f.room === r ? 'selected' : ''}>${esc(r)}</option>`).join('')}<option value="公共" ${f.room === '公共' ? 'selected' : ''}>公共區域</option></select>
      <div class="lbl">類型</div>
      <div class="chips">${ISSUE_TYPES.map((t) => `<button class="chip" data-qt="${t}" aria-pressed="${f.type === t}">${t}</button>`).join('')}</div>
      ${f.type === '缺備品' ? `<div class="lbl">缺哪些（勾選並調整數量）</div><div>${names.map((n) => `
        <div class="sitem"><label><input type="checkbox" data-qi="${esc(n)}" ${f.items[n] ? 'checked' : ''}>${esc(n)}</label>
        ${f.items[n] ? `<span class="qty"><button data-qm="${esc(n)}" aria-label="減少">−</button><b>${f.items[n]}</b><button data-qp="${esc(n)}" aria-label="增加">＋</button></span>` : ''}</div>`).join('') || '<p class="small muted">先選房號，或請管理員在備品清單建立品項。</p>'}
        <input type="text" id="qExtra" placeholder="其他沒列出的品項，例如：吹風機" value="${esc(f.extra)}" style="margin-top:8px"></div>` : ''}
      <div class="lbl">說明</div>
      <textarea id="qText" placeholder="${f.type === '遺留物' ? '例如：黑色充電線，已放櫃台抽屜' : '例如：浴室燈不亮、馬桶一直流水'}">${esc(f.text)}</textarea>
      <div class="lbl">照片（最多 3 張）</div>
      ${f.photos.length < 3 ? `<label class="pick">📷 拍照或選照片<input type="file" id="qPhoto" accept="image/*" multiple></label>` : ''}
      <div class="thumbs">${f.photos.map((p, i) => `<img src="${p}" alt="照片 ${i + 1}" data-qx="${i}" title="點一下移除">`).join('')}</div>
      <div class="lbl">你的名字</div><input type="text" id="qBy" value="${esc(S.me)}" placeholder="例如：小美">
      <div class="btnrow"><button class="btn ghost" id="qClose">取消</button><button class="btn wide" id="qSend">送出回報</button></div>`;
  };
  const keep = () => { const t = $('#qText'), x = $('#qExtra'), r = $('#qRoom'), b = $('#qBy'); if (t) f.text = t.value; if (x) f.extra = x.value; if (r) f.room = r.value; if (b) { S.me = b.value.trim(); ls.set('eroom.me', S.me); } };
  draw();
  const body = $('#sheetBody');
  body.onclick = async (e) => {
    const t = e.target;
    if (t.dataset.qt) { keep(); f.type = t.dataset.qt; return draw(); }
    if (t.dataset.qp) { keep(); f.items[t.dataset.qp] = Math.min(99, f.items[t.dataset.qp] + 1); return draw(); }
    if (t.dataset.qm) { keep(); f.items[t.dataset.qm] = Math.max(1, f.items[t.dataset.qm] - 1); return draw(); }
    if (t.dataset.qx != null) { keep(); f.photos.splice(+t.dataset.qx, 1); return draw(); }
    if (t.id === 'qClose') return closeSheet();
    if (t.id === 'qSend') {
      keep();
      const items = Object.keys(f.items).map((name) => ({ name, qty: f.items[name] }));
      if (f.extra.trim()) f.extra.split(/[、,，]/).map((x) => x.trim()).filter(Boolean).forEach((name) => items.push({ name, qty: 1 }));
      if (!f.room) return toast('請選房號', false, true);
      if (!f.type) return toast('請選類型', false, true);
      if (!f.text.trim() && !items.length && !f.photos.length) return toast('請寫一下說明或附照片', false, true);
      t.disabled = true; t.textContent = '送出中⋯';
      try {
        await api('issues', { method: 'POST', body: JSON.stringify({ p: S.prop, room: f.room === '公共' ? 'PUBLIC' : f.room, d: S.date, type: f.type, text: f.text.trim(), items, photos: f.photos, by: S.me }) });
        closeSheet(); toast('已送出回報'); await loadIssues(); renderAll();
      } catch (err) { t.disabled = false; t.textContent = '送出回報'; toast(err.message, false, true); }
    }
  };
  body.onchange = async (e) => {
    const t = e.target;
    if (t.id === 'qRoom') { keep(); f.items = {}; return draw(); }
    if (t.dataset.qi) { keep(); t.checked ? (f.items[t.dataset.qi] = 1) : delete f.items[t.dataset.qi]; return draw(); }
    if (t.id === 'qPhoto') {
      keep();
      for (const file of [...t.files].slice(0, 3 - f.photos.length)) {
        try { f.photos.push(await shrink(file)); } catch (err) { toast(err.message, false, true); }
      }
      draw();
    }
  };
  openSheet();
}

// ---------- 管理員 ----------
function renderLock() { const b = $('#lockBtn'); b.textContent = S.admin ? '🔓' : '🔒'; b.classList.toggle('on', !!S.admin); b.setAttribute('aria-label', S.admin ? '管理員已登入，點一下登出' : '管理員登入'); }
$('#lockBtn').onclick = () => {
  if (S.admin) { S.admin = ''; ss.set('eroom.admin', ''); renderLock(); renderAll(); toast('已登出管理員'); return; }
  $('#sheetBody').innerHTML = `<h3 style="font-size:24px;font-family:inherit">管理員登入</h3><div class="sub">登入後可以編輯手冊、備品、房號與房間資料。員工不用登入。</div>
    <input type="password" id="aPw" autocomplete="current-password" placeholder="管理員密碼">
    <div class="btnrow"><button class="btn ghost" id="aClose">取消</button><button class="btn wide" id="aGo">登入</button></div>`;
  $('#aClose').onclick = closeSheet;
  const go = async () => {
    const pw = $('#aPw').value; if (!pw) return;
    S.admin = pw;
    try { await api('admin', { method: 'POST' }); ss.set('eroom.admin', pw); closeSheet(); renderLock(); renderAll(); toast('管理員已登入'); }
    catch (e) { S.admin = ''; toast(e.message, false, true); }
  };
  $('#aGo').onclick = go; $('#aPw').onkeydown = (e) => e.key === 'Enter' && go();
  openSheet(); setTimeout(() => $('#aPw').focus(), 250);
};

// ---------- toast ----------
let toastT;
function toast(msg, canUndo, err) {
  const t = $('#toast');
  $('#toastMsg').textContent = msg;
  $('#toastUndo').style.display = canUndo ? '' : 'none';
  t.classList.toggle('err', !!err);
  t.classList.add('on');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), canUndo ? 5000 : 2400);
}
$('#toastUndo').onclick = () => { $('#toast').classList.remove('on'); undo(); };

// ---------- 事件 ----------
document.addEventListener('click', (e) => {
  const t = e.target;
  const tab = t.closest('[data-tab]');
  if (tab) { $('#toast').classList.remove('on'); S.tab = tab.dataset.tab; if (S.tab === 'rooms') S.reports = {}; document.querySelectorAll('nav.tabs button').forEach((b) => b.toggleAttribute('aria-current', false)); tab.setAttribute('aria-current', 'page'); document.querySelectorAll('section.page').forEach((s) => s.classList.toggle('on', s.id === 'p-' + S.tab)); renderAll(); scrollTo(0, 0); return; }
  const pb = t.closest('[data-prop]');
  if (pb) { selectProp(pb.dataset.prop); return; }
  const tool = t.closest('[data-tool]');
  if (tool) { S.tool = S.tool === tool.dataset.tool ? null : tool.dataset.tool; renderTools(); return; }
  if (t.closest('#textBtn')) { openText(); return; }
  const rv = t.closest('[data-rview]');
  if (rv) { S.roomView = rv.dataset.rview; renderRooms(); return; }
  const rs = t.closest('[data-resolve]');
  if (rs) { resolveIssue(+rs.dataset.resolve, rs.dataset.to); return; }
  const fi = t.closest('[data-ifilter]');
  if (fi) { S.issueFilter = fi.dataset.ifilter; loadIssues().then(renderIssues).catch(() => {}); renderIssues(); return; }
  if (t.closest('#newIssue')) { openIssueForm(''); return; }
  if (t.closest('[data-goissue]')) { e.preventDefault(); document.querySelector('[data-tab="issue"]').click(); return; }
  const pl = t.closest('.plate');
  if (pl) {
    const room = pl.dataset.room;
    const tl = TOOLS.find((x) => x.id === S.tool);
    if (tl) apply([room], tl.clear ? { clear: true } : tl.kind ? { kind: tl.kind } : { status: tl.status }, tl.label);
    else openRoom(room);
    return;
  }
  const dn = t.closest('[data-done]');
  if (dn) { const r = dn.dataset.done; const cur = recs()[r] || {}; apply([r], { status: cur.status === 'done' ? 'todo' : 'done' }, cur.status === 'done' ? '改回要掃' : '掃好了'); return; }
  const bk = t.closest('[data-book]');
  if (bk) { S.bookKey = bk.dataset.book; renderBook(); return; }
  const ed = t.closest('[data-edit]');
  if (ed) { openEdit(ed.dataset.edit); return; }
  const ri = t.closest('[data-rinfo]');
  if (ri && S.admin) { openRoomInfo(ri.dataset.rinfo); return; }
  if (t.closest('#editRoomList')) { openRoomList(); return; }
});
$('#prevDay').onclick = () => shiftDate(-1);
$('#rptPrev').onclick = () => shiftMonth(-1);
$('#rptNext').onclick = () => shiftMonth(1);
$('#nextDay').onclick = () => shiftDate(1);
$('#goToday').onclick = () => { S.date = todayStr(); refresh(); };
async function shiftDate(n) { S.date = addDays(S.date, n); refresh(); }
async function selectProp(p) {
  S.prop = p; ls.set('eroom.prop', p);
  document.querySelectorAll('[data-prop]').forEach((b) => b.setAttribute('aria-pressed', b.dataset.prop === p));
  if (!S.rooms[p]) await loadRooms(p).catch(() => {});
  refresh();
}
async function refresh() {
  renderAll();
  try { await Promise.all([loadRecs(), loadIssues()]); $('#offline').classList.remove('on'); } catch { $('#offline').classList.add('on'); }
  renderAll();
}
function renderAll() {
  if (S.tab === 'today') { renderTools(); renderToday(); }
  if (S.tab === 'issue') renderIssues();
  if (S.tab === 'book') renderBook();
  if (S.tab === 'supply') renderSupply();
  if (S.tab === 'rooms') renderRooms();
}
// 回到畫面時更新（別人改過的會同步進來）
document.addEventListener('visibilitychange', () => { if (!document.hidden && S.tab === 'today' && !S.pending.length) refresh(); });
setInterval(() => { if (!document.hidden && S.tab === 'today' && !S.pending.length && !$('#sheet').classList.contains('on')) loadRecs().then(() => renderToday()).catch(() => {}); }, 30000);

// ---------- 啟動 ----------
(async function init() {
  renderLock();
  document.querySelectorAll('[data-prop]').forEach((b) => b.setAttribute('aria-pressed', b.dataset.prop === S.prop));
  renderAll();
  await Promise.all([loadRooms('ersu'), loadRooms('eryanglou'), loadDocs(), loadIssues()].map((p) => p.catch(() => {})));
  if (S.admin) api('admin', { method: 'POST' }).catch(() => { S.admin = ''; ss.set('eroom.admin', ''); renderLock(); });
  flush();
  refresh();
})();
</script>
